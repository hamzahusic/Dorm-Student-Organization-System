    <!-- MODALS -->

    <!-- Add Meal Modal -->
    <div class="modal fade" id="addMealModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="addMealLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addMealLabel">Add New Meal</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addMealForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="addMealName" class="form-label">Meal Name</label>
                            <input type="text" name="name" class="form-control" id="addMealName" placeholder="e.g., Grilled Chicken with Rice" required>
                        </div>
                        <div class="mb-3">
                            <label for="addMealType" class="form-label">Meal Type</label>
                            <select class="form-select" name="type" id="addMealType" required>
                                <option value="">Select meal type...</option>
                                <option value="breakfast">Breakfast</option>
                                <option value="lunch">Lunch</option>
                                <option value="dinner">Dinner</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="addMealDescription" class="form-label">Description</label>
                            <textarea class="form-control" name="description" id="addMealDescription" rows="3" placeholder="Describe the meal ingredients and preparation..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="addMealDate" class="form-label">Date</label>
                            <input type="date" name="date" class="form-control" id="addMealDate" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Add Meal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Update Meal Modal -->
    <div class="modal fade" id="updateMealModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="updateMealLabel">Update Meal</h1>
                    <button type="button" class="btn-close" onclick="AdminMealService.closeModal()"></button>
                </div>
                <form id="updateMealForm">
                    <input name="id" id="updateMealId" hidden>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="updateMealName" class="form-label">Meal Name</label>
                            <input type="text" name="name" class="form-control" id="updateMealName" required>
                        </div>
                        <div class="mb-3">
                            <label for="updateMealType" class="form-label">Meal Type</label>
                            <select class="form-select" name="type" id="updateMealType" required>
                                <option value="">Select meal type...</option>
                                <option value="breakfast">Breakfast</option>
                                <option value="lunch">Lunch</option>
                                <option value="dinner">Dinner</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="updateMealDescription" class="form-label">Description</label>
                            <textarea class="form-control" name="description" id="updateMealDescription" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="updateMealDate" class="form-label">Date</label>
                            <input type="date" name="date" class="form-control" id="updateMealDate" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Meal Modal -->
    <div class="modal fade" id="deleteMealModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="deleteMealLabel">Delete Meal</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input id="deleteMealId" hidden>
                    <p>Are you sure you want to delete <strong id="delete-meal-head"></strong>?</p>
                    <p class="text-muted">This action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="AdminMealService.deleteMeal()">Delete</button>
                </div>
            </div>
        </div>
