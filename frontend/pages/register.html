
<section>
    <div class="auth-page-container">
    <div class="auth-page-row">
        <div class="auth-page-image">
            <div class="auth-page-image-content">
                <h1>Join Us</h1>
                <p>Create an account to get started</p>
            </div>
        </div>
        <div class="auth-page-form">
            <div class="auth-page-form-wrapper">
                <h2>Create Account</h2>
                <p class="auth-page-subtitle">Fill in your details to register</p>
                
                <form id="authRegisterForm">
                    <div class="auth-page-form-group">
                        <label for="authRegisterFirstName" class="auth-page-label">First Name</label>
                        <input type="text" class="auth-page-input" id="authRegisterFirstName" name="first_name" placeholder="John" required>
                    </div>
                    <div class="auth-page-form-group">
                        <label for="authRegisterLastName" class="auth-page-label">Last Name</label>
                        <input type="text" class="auth-page-input" id="authRegisterLastName" name="last_name" placeholder="John" required>
                    </div>
                    <div class="auth-page-form-group">
                        <label for="authRegisterEmail" class="auth-page-label">Email</label>
                        <input type="email" class="auth-page-input" id="authRegisterEmail" name="email" placeholder="your@email.com" required>
                    </div>
                    <div class="auth-page-form-group">
                        <label for="authRegisterPassword" class="auth-page-label">Password</label>
                        <input type="password" class="auth-page-input" id="authRegisterPassword" name="password" placeholder="Create password" required>
                    </div>
                    <button type="submit" class="auth-page-btn">Create Account</button>
                    
                    <div class="auth-page-divider">
                        <span>Already have an account?</span>
                    </div>
                    
                    <div class="auth-page-text-center">
                        <a href="#login" class="auth-page-link">Sign in instead</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</section>
