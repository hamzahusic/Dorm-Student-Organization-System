    <!-- MODALS -->

    <!-- Add Room Modal -->
    <div class="modal fade" id="addRoomModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="addRoomLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addRoomLabel">Add New Room</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addRoomForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="addRoomNumber" class="form-label">Room Number</label>
                            <input type="number" name="id" class="form-control" id="addRoomNumber" placeholder="Enter room number e.g 101">
                        </div>
                        <div class="mb-3">
                            <label for="addCapacity" class="form-label">Capacity</label>
                            <input type="number" name="capacity" class="form-control" id="addCapacity" placeholder="Enter room capacity e.g 2">
                        </div>
                        <div class="mb-3">
                            <label for="addFloorNumber" class="form-label">Floor Number</label>
                            <input type="number" name="floor" class="form-control" id="addFloorNumber" placeholder="Enter floor number e.g 1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Add Room</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Update Modal -->
    <div class="modal fade" id="updateRoomModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="updateRoomLabel">Update Room</h1>
                    <button type="button" class="btn-close" onclick="AdminRoomService.closeModal()"></button>
                </div>
                <form id="updateRoomForm">
                    <input name="original_id" id="originalRoomId" hidden>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="roomNumber" class="form-label">Room Number</label>
                            <input type="number" class="form-control" name="id" id="roomNumber">
                        </div>
                        <div class="mb-3">
                            <label for="roomCapacity" class="form-label">Capacity</label>
                            <input type="number" name="capacity" class="form-control" id="roomCapacity">
                        </div>
                        <div class="mb-3">
                            <label for="floorNumber" class="form-label">Floor Number</label>
                            <input type="number" name="floor" class="form-control" id="floorNumber">
                        </div>
                        <div class="mb-3">
                            <label for="assignedStudents" class="form-label">Assigned Students</label>
                            <select class="form-select" name="students_ids" id="assignedRoomStudents" multiple size="8">
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal fade" id="deleteRoomModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="deleteRoomLabel">Delete Room</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input id="deleteRoomId" hidden>
                    <p>Are you sure you want to delete <strong id="delete-room-head"></strong>?</p>
                    <div id="delete-room-body">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="AdminRoomService.deleteRoom()">Delete</button>
                </div>
            </div>
        </div>
    </div>
